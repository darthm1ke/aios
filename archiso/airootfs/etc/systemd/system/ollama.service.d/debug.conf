[Unit]
# The stock ollama.service has Wants=network-online.target. Reset it: a local
# model needs nothing from the network, and waiting on it stalls boot offline.
Wants=

[Service]
# Use the package default model store (/var/lib/ollama) - the model is baked
# into the ISO there at build time. The old /tmp/ollama-models override forced
# a fragile copy-from-USB-into-RAM dance on every boot; removed.
# KEEP_ALIVE=-1 pins the model in RAM so the AI is always instantly ready.
Environment=OLLAMA_KEEP_ALIVE=-1
Environment=OLLAMA_NUM_PARALLEL=1
StandardOutput=journal
StandardError=journal
