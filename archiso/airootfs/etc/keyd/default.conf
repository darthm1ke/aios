[ids]
*

[main]
# Caps Lock is the push-to-talk key. We must NOT map it to `noop` - that makes
# keyd emit nothing, so the PTT daemon never sees the key (this is why voice
# never worked). Instead remap it to F13: an inert key that does NOT toggle caps
# lock, but DOES emit a clean key-down/up event the PTT daemon watches for.
capslock = f13
# Right Ctrl is the VM/QEMU fallback PTT key - left untouched so it passes through.
